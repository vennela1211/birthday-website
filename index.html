<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/page1.css">
</head>
<body>
  <div class="lock-screen-container">
    <div class="illustration-panel">
      <div class="avatar-frame">
        <img src="https://media.tenor.com/2cCE8KUWjmgAAAAj/flower-pupper.gif" alt="Flower puppy">
        <p>HEYYY HI...!!!🎈❤️</p>
      </div>
    </div>

    <div class="passcode-panel">
      <h2 class="passcode-title">Enter a passcode</h2>

      <div class="dots-display">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <div class="keypad-grid">
        <button class="key-btn">1</button>
        <button class="key-btn">2</button>
        <button class="key-btn">3</button>
        <button class="key-btn">4</button>
        <button class="key-btn">5</button>
        <button class="key-btn">6</button>
        <button class="key-btn">7</button>
        <button class="key-btn">8</button>
        <button class="key-btn">9</button>
        <button class="key-btn special-btn">⌫</button>
        <button class="key-btn">0</button>
        <button class="key-btn special-btn">#</button>
      </div>
    </div>
  </div>

  <script src="js/page1.js"></script>
</body>
</html>
