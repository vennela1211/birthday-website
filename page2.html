<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Cake 🎂</title>
    <link rel="stylesheet" href="css/page2.css">
</head>
<body>

    <div class="birthday-title">
        <h1>HAPPY BIRTHDAY 🎉</h1>
    </div>

    <div class="cake-area">
        <div class="cake">
            <div class="cake-layer-1"></div>
            <div class="cream"></div>
            <div class="cake-layer-2"></div>
            <div class="chocolate-drip"></div>
            <div class="cake-top"></div>

            <div class="candles">
                <div class="candle">
                    <div class="wick"></div>
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <div class="wick"></div>
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <div class="wick"></div>
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <div class="wick"></div>
                    <div class="flame"></div>
                </div>
            </div>
        </div>
    </div>

    <button id="blowButton">💨 Click Here 😁</button>

    <script src="js/page2.js"></script>
</body>
</html>
